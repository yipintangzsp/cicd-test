# V17 OpenTelemetry baseline.  It is versioned but not automatically applied.
# The collector exports its own metrics for the existing Prometheus stack to
# scrape.  Configure a reviewed traces/logs exporter before production use.
apiVersion: v1
kind: Namespace
metadata:
  name: ns-observability
  labels:
    app.kubernetes.io/part-of: zhanglab-platform-v17
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: v17-otel-collector-config
  namespace: ns-observability
data:
  collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
        spike_limit_mib: 64
      batch:
        timeout: 5s
    exporters:
      prometheus:
        endpoint: 0.0.0.0:8889
      debug:
        verbosity: basic
    service:
      telemetry:
        metrics:
          address: 0.0.0.0:8888
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [prometheus]
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: v17-otel-collector
  namespace: ns-observability
  labels:
    app.kubernetes.io/name: v17-otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: v17-otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: v17-otel-collector
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8888"
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.120.0
          imagePullPolicy: IfNotPresent
          args: ["--config=/conf/collector.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            - name: metrics
              containerPort: 8888
            - name: prom-exporter
              containerPort: 8889
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
          volumeMounts:
            - name: config
              mountPath: /conf
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: v17-otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: v17-otel-collector
  namespace: ns-observability
  labels:
    app.kubernetes.io/name: v17-otel-collector
spec:
  selector:
    app.kubernetes.io/name: v17-otel-collector
  ports:
    - name: metrics
      port: 8888
      targetPort: metrics
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
