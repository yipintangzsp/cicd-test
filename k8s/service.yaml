# ============================================================
#  hello-app v2.0 Service — Stable Track 专属
#
#  Fix-1: selector 新增 track: stable，精确隔离 Stable Pod，
#  防止 Canary/v2 的 NotReady Pod 污染 Endpoints 池，
#  彻底消除 "no available server" 最根本的结构性根因。
#
#  Canary 流量由独立的 hello-app-canary-svc 处理（见 canary-service.yaml）
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: hello-app-svc
  namespace: default
  labels:
    app: hello-app
    version: "2.0"
    track: stable
spec:
  type: NodePort
  selector:
    app: hello-app
    track: stable   # RC Fix-1: 只选 Stable Pod，与 Canary/v2 彻底隔离
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30088
