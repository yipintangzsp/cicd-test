# ============================================================
#  hello-app Canary Service — Canary Track 专属
#
#  Fix-1 配套：为灰度 Pod 单独创建 Service，
#  与 hello-app-svc (stable) 完全隔离，
#  避免 Canary 启动期间的 NotReady Pod 污染 Stable Endpoints。
#
#  用途：
#    - Jenkins 健康检查阶段可直接 curl canary-svc 精确验证灰度实例
#    - 未来接入 Ingress Traffic Splitting 时作为 canary 后端
#    - Canary 不存在时此 Service 的 Endpoints 为空（正常状态）
#
#  部署：kubectl apply -f k8s/canary-service.yaml
#  删除：kubectl delete -f k8s/canary-service.yaml（Canary 下线后）
# ============================================================
apiVersion: v1
kind: Service
metadata:
  name: hello-app-canary-svc
  namespace: default
  labels:
    app: hello-app
    track: canary
spec:
  type: ClusterIP   # 仅集群内使用，不暴露 NodePort
  selector:
    app: hello-app
    track: canary   # 精确选中 Canary Pod
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
