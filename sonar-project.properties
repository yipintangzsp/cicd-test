# SonarQube 项目配置文件
# 供 sonar-scanner CLI 读取，无需 Maven/Gradle

sonar.projectKey=hello-app
sonar.projectName=hello-app
sonar.projectVersion=1.0

# 扫描目录（HTML/JS/CSS 项目直接扫根目录）
sonar.sources=.

# 排除不需要扫描的目录
sonar.exclusions=**/.git/**,**/node_modules/**,**/.scannerwork/**

# 编码
sonar.sourceEncoding=UTF-8

# Bypass missing java binaries issue
sonar.java.binaries=.
