# ============================================================
#  AlertManager 配置 — 钉钉告警收口
#
#  告警来源（三路收口）：
#    1. Jenkins 构建失败  → Jenkinsfile post.failure 直接 curl
#    2. ArgoCD 同步失败   → argocd-notifications → 此 webhook
#    3. Grafana 指标异常  → AlertManager → 此 webhook
#
#  告警终端：钉钉（唯一终端）
#  变量：使用 Jenkins Credentials / K8s Secret（禁止 .env）
#
#  部署：
#    kubectl apply -f monitoring/alertmanager-dingtalk.yaml
#    kubectl rollout restart deployment/alertmanager -n monitoring
# ============================================================

---
# ── 1. AlertManager 主配置（钉钉 Webhook）─────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: monitoring
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m

    # 路由规则：全部告警 → 钉钉
    route:
      group_by: ['alertname', 'namespace', 'pod']
      group_wait:      30s
      group_interval:  5m
      repeat_interval: 12h
      receiver: dingtalk-devops
      routes:
        # critical 告警：立即发送
        - match:
            severity: critical
          receiver: dingtalk-devops
          group_wait: 10s
          repeat_interval: 1h
        # warning 告警：聚合后发送
        - match:
            severity: warning
          receiver: dingtalk-devops

    receivers:
      - name: dingtalk-devops
        webhook_configs:
          # 直接调用钉钉 Webhook（无需中间件）
          - url: 'https://oapi.dingtalk.com/robot/send?access_token=a09f532db2a96d203d6d2ed9c5b581211155b6ee84ea8a702bbeb5f69122a413'
            send_resolved: true
            http_config:
              tls_config:
                insecure_skip_verify: true

    # 告警抑制：critical 存在时抑制同一 Pod 的 warning
    inhibit_rules:
      - source_match:
          severity: critical
        target_match:
          severity: warning
        equal: ['alertname', 'pod']

---
# ── 2. 告警通知模板（钉钉格式）───────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-templates
  namespace: monitoring
data:
  dingtalk.tmpl: |
    {{ define "dingtalk.devops.message" }}
    {{- if gt (len .Alerts.Firing) 0 }}
    🔥 **[DevOps 2.0 告警触发]**
    {{- range .Alerts.Firing }}
    📌 **{{ .Labels.alertname }}**
    - 严重级别: {{ .Labels.severity }}
    - 应用: {{ .Labels.app }} v{{ .Labels.version }}
    - Pod: {{ .Labels.pod }}
    - 描述: {{ .Annotations.description }}
    - 时间: {{ .StartsAt.Format "2006-01-02 15:04:05" }}
    {{- end }}
    {{- end }}
    {{- if gt (len .Alerts.Resolved) 0 }}
    ✅ **[DevOps 2.0 告警恢复]**
    {{- range .Alerts.Resolved }}
    - {{ .Labels.alertname }} 已恢复（{{ .Labels.pod }}）
    {{- end }}
    {{- end }}
    🔗 Grafana: http://192.168.1.58:30030
    {{ end }}
